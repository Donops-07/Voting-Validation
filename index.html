<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="asign.css">
</head>

<body>
    <img src="portal.jpg" alt="Portal">
    <nav>
        <h1>E-Government Voting Validation</h1>
    </nav>
    <div id="popup" class="pop-up">
        <h2>Result</h2>
        <div class="content">
            <!-- <hr> -->
            <p id="display"></p>
        </div>
        <button onclick="closeUp()">Close</button>
    </div>
    <main>
        <form action="">
            <h3>Please fill your details below</h3>
            <input type="text" placeholder="Enter your first name" id="firstname">
            <input type="text" placeholder="Enter your last name" id="lastname">
            <input type="number" placeholder="Enter your age" id="age">
            <h4>Choose your gender</h4>
            <div class="check">
                <input type="radio" name="gender" id="male">
                <p>Male</p>
            </div>
            <div class="check">
                <input type="radio" name="gender" id="female">
                <p>Female</p>
            </div>
        </form>
        <button onclick="openUp()">Submit</button>
    </main>
</body>

<script>
    const ageInput = document.getElementById('age');
    const submitButton = document.querySelector('button');
    const popUp = document.getElementById("popup");
    const message = document.getElementById("display");
    const firstName = document.getElementById("firstname");
    const lastName = document.getElementById("lastname");
    const firstSex = document.getElementById("male");
    const secondSex = document.getElementById("female");



    popUp.style.display = "none";
    function openUp() {
        const age = parseInt(ageInput.value);
        const firstName1 = firstName.value;
        popUp.style.display = "flex";
        //checking if the first name is empty
        if (firstName1.trim() === "") {
            message.style.color = "red";
            message.textContent = 'Please enter your first name.';
            return;
        }

        //checking the gender selection
        const gender1 = firstSex.checked;
        const gender2 = secondSex.checked;
        if (!gender1 && !gender2) {
            message.style.color = "red";
            message.textContent = "Please select a gender.";
            return;
        }

        //checking the age input
        if (isNaN(age)) {
            message.style.color = "red";
            message.textContent = ` Dear, ${firstName1} Please enter a valid age.`;
        } else if (age < 18) {
            message.style.color = "red";
            message.textContent = `Dear, ${firstName1} You are not eligible to vote. You must be at least 18 years old.`;
        } else {
            message.style.color = "white";
            message.textContent = `Dear, ${firstName1} Thank you for submitting your details. You are eligible to vote!`;
        }

        firstname.value = "";
        lastname.value = "";
        ageInput.value = "";
        firstSex.checked = false;
        secondSex.checked = false;

    };
    function closeUp() {
        popUp.style.display = "none";
    };

</script>

</html>
